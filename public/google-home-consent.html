<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vincular OSONE ao Google Home</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 32px;
      text-align: center;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 13px; color: #a1a1aa; line-height: 1.6; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
    }
    #approveBtn { background: #10b981; color: #052e21; margin-bottom: 10px; }
    #cancelBtn { background: rgba(255,255,255,0.06); color: #f4f4f5; }
    #status { font-size: 12px; color: #f59e0b; margin-top: 14px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Vincular OSONE ao Google Home</h1>
    <p>O Google Assistant está pedindo permissão para controlar seus dispositivos conectados no OSONE (via Tuya). Autorize apenas se foi você quem iniciou esse vínculo pelo app Google Home.</p>
    <button id="approveBtn">Autorizar</button>
    <button id="cancelBtn">Cancelar</button>
    <div id="status"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const redirectUri = params.get('redirect_uri');
    const state = params.get('state') || '';
    const statusEl = document.getElementById('status');

    document.getElementById('cancelBtn').addEventListener('click', () => {
      if (redirectUri) {
        window.location.href = redirectUri + '?error=access_denied&state=' + encodeURIComponent(state);
      } else {
        window.close();
      }
    });

    document.getElementById('approveBtn').addEventListener('click', async () => {
      if (!redirectUri) {
        statusEl.textContent = 'redirect_uri ausente na URL — não é possível continuar.';
        return;
      }
      statusEl.textContent = 'Autorizando...';
      try {
        const res = await fetch('/api/google-home/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ redirect_uri: redirectUri, state })
        });
        const data = await res.json();
        if (!res.ok || !data.redirectTo) {
          statusEl.textContent = data.error || 'Falha ao gerar autorização.';
          return;
        }
        window.location.href = data.redirectTo;
      } catch (e) {
        statusEl.textContent = 'Erro de conexão ao autorizar.';
      }
    });
  </script>
</body>
</html>
