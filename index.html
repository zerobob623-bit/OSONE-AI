<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSONE</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OSONE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      /**
       * O service worker é conferido A CADA ABERTURA, e não quando o navegador resolver.
       *
       * Só chamar register() não basta: quando já existe um registro, o Chrome limita essa
       * conferência a uma vez por dia. Foi isso que transformou um cache errado num problema que
       * durava — enquanto a conferência não acontecia, o navegador seguia com o service worker
       * antigo, entregando o index.html velho, que aponta para um pacote de código que já não
       * existe no servidor. O resultado era tela branca em toda atualização de página.
       *
       * updateViaCache 'none' garante que o próprio /sw.js não venha do cache do navegador, e o
       * update() explícito dispensa o agendamento. Juntos, um service worker desatualizado dura
       * no máximo uma abertura de página, em vez de até um dia.
       */
      if ('serviceWorker' in navigator && !window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1') && !window.location.hostname.includes('.run.app')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then((registro) => registro.update())
            .catch(() => { /* sem service worker o app funciona igual, só não abre offline */ });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
