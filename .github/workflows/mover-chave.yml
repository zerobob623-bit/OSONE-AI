name: Mover chave de assinatura para o privado
on: workflow_dispatch

jobs:
  mover:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar os quatro secrets para OSONE-AI-code
        env:
          GH_TOKEN: ${{ secrets.PAT_PRIVADO }}
          B64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          DESTINO=zerobob623-bit/OSONE-AI-code
          gh secret set ANDROID_KEYSTORE_BASE64   --repo "$DESTINO" --body "$B64"
          gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$DESTINO" --body "$KPASS"
          gh secret set ANDROID_KEY_ALIAS         --repo "$DESTINO" --body "$ALIAS"
          gh secret set ANDROID_KEY_PASSWORD      --repo "$DESTINO" --body "$APASS"
          echo "Os quatro secrets foram gravados em $DESTINO."
