name: Publicar Release (.exe e AppImage)

# Dispara ao empurrar uma tag de versão (ex: v1.1.0), ou manualmente pelo botão
# "Run workflow" na aba Actions do GitHub.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Necessário para o electron-builder criar a Release e subir os instaladores.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # Um de cada vez de propósito: os dois jobs publicam na MESMA Release do GitHub, e
      # rodando em paralelo os dois tentam criá-la ao mesmo tempo, o que pode gerar release
      # duplicada ou erro de conflito. Em série, o segundo job encontra a Release já criada.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows (.exe)
            alvo: --win
          - os: ubuntu-latest
            nome: Linux (AppImage)
            alvo: --linux

    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Construir o app (frontend + servidor)
        # As chaves do Firebase precisam existir AQUI, neste passo: o Vite embute os valores
        # de import.meta.env.VITE_* dentro do bundle no momento do build, não em tempo de
        # execução. Sem elas o app é publicado com o login Google e a sincronização em nuvem
        # desligados, mesmo com tudo o mais funcionando.
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_FIRESTORE_DATABASE_ID }}

      - name: Conferir se o Firebase entrou no build
        # Trava de segurança: se um secret estiver faltando ou com o nome escrito errado, o
        # build passa normalmente e o problema só aparece quando um usuário tenta entrar com o
        # Google no app já distribuído. Aqui a publicação para antes disso acontecer.
        #
        # Confere TODOS os secrets obrigatórios, não só um: o app considera o Firebase
        # "configurado" olhando apenas apiKey/projectId/appId, então um authDomain faltando
        # passaria despercebido no build e só quebraria na hora do login.
        shell: bash
        env:
          API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Nomes reais dos secrets, só para a mensagem de erro apontar o que cadastrar.
          NOMES: "VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID"
        run: |
          faltando=""
          i=0
          for valor in "$API_KEY" "$AUTH_DOMAIN" "$PROJECT_ID" "$STORAGE_BUCKET" "$SENDER_ID" "$APP_ID"; do
            i=$((i + 1))
            nome=$(echo $NOMES | cut -d' ' -f$i)
            [ -z "$valor" ] && faltando="$faltando $nome"
          done

          if [ -n "$faltando" ]; then
            echo "ERRO: secrets ausentes ou com nome escrito errado:$faltando"
            echo "Cadastre em Settings > Secrets and variables > Actions, conferindo a grafia exata."
            exit 1
          fi

          # Além de existirem, os valores precisam ter chegado de fato dentro do bundle.
          if grep -rq "$PROJECT_ID" dist/assets/ && grep -rq "$AUTH_DOMAIN" dist/assets/; then
            echo "OK: os 6 secrets estão definidos e as chaves foram embutidas no build."
          else
            echo "ERRO: o build saiu SEM as chaves do Firebase dentro do bundle."
            echo "O app seria publicado sem login Google e sem sincronização em nuvem."
            exit 1
          fi

      - name: Baixar a voz local (Piper)
        # Vai embutida no instalador para que a resposta em áudio nunca dependa de cota: quando
        # o limite diário do Gemini e o mensal da ElevenLabs acabam, o áudio continua saindo
        # por esta voz, que roda na máquina do próprio usuário.
        #
        # Tenta três vezes porque o download vem de servidores externos e uma falha passageira
        # de rede não deveria custar uma publicação inteira.
        shell: bash
        run: |
          for tentativa in 1 2 3; do
            npm run baixar-voz && break
            echo "Tentativa $tentativa falhou; nova tentativa em ${tentativa}0s..."
            sleep ${tentativa}0
          done

      - name: Conferir se a voz local entrou no pacote
        # Trava proposital: antes esta etapa apenas avisava e deixava publicar assim mesmo, o que
        # geraria um instalador SEM a voz local sem ninguém perceber. Como a atualização é
        # automática, esse instalador incompleto chegaria sozinho em todos os usuários. É melhor
        # a publicação parar e ser refeita do que distribuir um app pela metade em silêncio.
        shell: bash
        run: |
          binario="vendor/piper/piper"
          [ "$RUNNER_OS" = "Windows" ] && binario="vendor/piper/piper.exe"
          modelo="vendor/piper/pt_BR-faber-medium.onnx"

          if [ -f "$binario" ] && [ -f "$modelo" ]; then
            echo "OK: voz local presente ($(du -h "$modelo" | cut -f1))."
          else
            echo "ERRO: a voz local não foi baixada, e o instalador sairia sem ela."
            echo "Os servidores de download podem estar fora do ar — rode o workflow de novo."
            ls -la vendor/piper 2>/dev/null || echo "(a pasta vendor/piper nem existe)"
            exit 1
          fi

      - name: Gerar instalador e publicar na Release
        run: npx electron-builder ${{ matrix.alvo }} --publish always
        env:
          # Token que o próprio GitHub Actions fornece; é o que o electron-builder usa para
          # criar a Release e anexar os instaladores. Não precisa cadastrar nada.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
