name: Publicar Release (.exe, AppImage e APK)

# Dispara ao empurrar uma tag de versão (ex: v1.1.0), ou manualmente pelo botão
# "Run workflow" na aba Actions do GitHub.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Parte da release que deve ser compilada
        required: true
        default: all
        type: choice
        options:
          - all
          - android

# Necessário para o electron-builder criar a Release e subir os instaladores.
permissions:
  contents: write

jobs:
  build:
    # Em uma publicacao normal compila os dois desktops. A opcao manual `android` permite
    # testar ou republicar somente o APK sem gastar tempo nem sobrescrever EXE/AppImage.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target != 'android' }}
    strategy:
      # Um de cada vez de propósito: os dois jobs publicam na MESMA Release do GitHub, e
      # rodando em paralelo os dois tentam criá-la ao mesmo tempo, o que pode gerar release
      # duplicada ou erro de conflito. Em série, o segundo job encontra a Release já criada.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows (.exe)
            alvo: --win
          - os: ubuntu-latest
            nome: Linux (AppImage)
            alvo: --linux

    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Construir o app (frontend + servidor)
        # As chaves do Firebase precisam existir AQUI, neste passo: o Vite embute os valores
        # de import.meta.env.VITE_* dentro do bundle no momento do build, não em tempo de
        # execução. Sem elas o app é publicado com o login Google e a sincronização em nuvem
        # desligados, mesmo com tudo o mais funcionando.
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_FIRESTORE_DATABASE_ID }}
          # URL publica, nao secreta. O desktop continua local; somente assinatura/checkout usam
          # a API hospedada para que nenhuma chave Stripe viaje dentro do instalador.
          VITE_OSONE_BILLING_URL: https://osone-ai-six.vercel.app

      - name: Conferir se o Firebase entrou no build
        # Trava de segurança: se um secret estiver faltando ou com o nome escrito errado, o
        # build passa normalmente e o problema só aparece quando um usuário tenta entrar com o
        # Google no app já distribuído. Aqui a publicação para antes disso acontecer.
        #
        # Confere TODOS os secrets obrigatórios, não só um: o app considera o Firebase
        # "configurado" olhando apenas apiKey/projectId/appId, então um authDomain faltando
        # passaria despercebido no build e só quebraria na hora do login.
        shell: bash
        env:
          API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Nomes reais dos secrets, só para a mensagem de erro apontar o que cadastrar.
          NOMES: "VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID"
        run: |
          faltando=""
          i=0
          for valor in "$API_KEY" "$AUTH_DOMAIN" "$PROJECT_ID" "$STORAGE_BUCKET" "$SENDER_ID" "$APP_ID"; do
            i=$((i + 1))
            nome=$(echo $NOMES | cut -d' ' -f$i)
            [ -z "$valor" ] && faltando="$faltando $nome"
          done

          if [ -n "$faltando" ]; then
            echo "ERRO: secrets ausentes ou com nome escrito errado:$faltando"
            echo "Cadastre em Settings > Secrets and variables > Actions, conferindo a grafia exata."
            exit 1
          fi

          # Aviso, não erro: o app já limpa espaços e quebras de linha ao ler estes valores. Mas
          # um secret sujo indica que a origem tem um caractere invisível colado, e vale
          # consertar lá — outra parte do sistema pode ler o mesmo valor sem limpar.
          i=0
          for valor in "$API_KEY" "$AUTH_DOMAIN" "$PROJECT_ID" "$STORAGE_BUCKET" "$SENDER_ID" "$APP_ID"; do
            i=$((i + 1))
            nome=$(echo $NOMES | cut -d' ' -f$i)
            limpo=$(printf '%s' "$valor" | tr -d '[:space:]')
            if [ "${#valor}" -ne "${#limpo}" ]; then
              echo "AVISO: o secret $nome tem espaço ou quebra de linha em volta."
              echo "       Reabra-o em Settings > Secrets and variables > Actions e cole de novo, sem o caractere extra."
            fi
          done

          # Além de existirem, os valores precisam ter chegado de fato dentro do bundle.
          if grep -rq "$PROJECT_ID" dist/assets/ && grep -rq "$AUTH_DOMAIN" dist/assets/; then
            echo "OK: os 6 secrets estão definidos e as chaves foram embutidas no build."
          else
            echo "ERRO: o build saiu SEM as chaves do Firebase dentro do bundle."
            echo "O app seria publicado sem login Google e sem sincronização em nuvem."
            exit 1
          fi

      - name: Baixar a voz local (Piper)
        # Vai embutida no instalador para que a resposta em áudio nunca dependa de cota: quando
        # o limite diário do Gemini e o mensal da ElevenLabs acabam, o áudio continua saindo
        # por esta voz, que roda na máquina do próprio usuário.
        #
        # Tenta três vezes porque o download vem de servidores externos e uma falha passageira
        # de rede não deveria custar uma publicação inteira.
        shell: bash
        run: |
          for tentativa in 1 2 3; do
            npm run baixar-voz && break
            echo "Tentativa $tentativa falhou; nova tentativa em ${tentativa}0s..."
            sleep ${tentativa}0
          done

      - name: Conferir se a voz local entrou no pacote
        # Trava proposital: antes esta etapa apenas avisava e deixava publicar assim mesmo, o que
        # geraria um instalador SEM a voz local sem ninguém perceber. Como a atualização é
        # automática, esse instalador incompleto chegaria sozinho em todos os usuários. É melhor
        # a publicação parar e ser refeita do que distribuir um app pela metade em silêncio.
        shell: bash
        run: |
          binario="vendor/piper/piper"
          [ "$RUNNER_OS" = "Windows" ] && binario="vendor/piper/piper.exe"
          modelo="vendor/piper/pt_BR-faber-medium.onnx"

          if [ -f "$binario" ] && [ -f "$modelo" ]; then
            echo "OK: voz local presente ($(du -h "$modelo" | cut -f1))."
          else
            echo "ERRO: a voz local não foi baixada, e o instalador sairia sem ela."
            echo "Os servidores de download podem estar fora do ar — rode o workflow de novo."
            ls -la vendor/piper 2>/dev/null || echo "(a pasta vendor/piper nem existe)"
            exit 1
          fi

      - name: Criar a Release antes de enviar qualquer arquivo
        # Evita a Release duplicada, que já quebrou a v1.2.3 inteira com o build todo verde.
        #
        # O electron-builder envia os arquivos em paralelo, e cada envio começa perguntando ao
        # GitHub "a Release desta tag existe? se não, cria". Quando dois envios fazem essa
        # pergunta no mesmo instante, os dois recebem "não" e os DOIS criam — e o GitHub aceita
        # duas Releases com a mesma tag sem reclamar. Os arquivos se dividem entre os dois
        # registros, e a página da tag mostra só um deles. Se calhar de mostrar o registro que
        # ficou sem o instalador, todo link de download vira 404 e a atualização automática para,
        # porque o latest.yml também some. Nada disso aparece nos logs: os dois jobs terminam
        # com sucesso.
        #
        # Criando a Release aqui, uma vez só e antes de qualquer envio, todos os envios
        # encontram uma Release pronta e nenhum precisa criar nada. É por isso que este passo
        # vem antes do electron-builder, e não depois.
        #
        # (O max-parallel: 1 lá em cima não resolve isto: a corrida acontece DENTRO de um único
        # job, entre os envios simultâneos do mesmo electron-builder.)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A tag vem da versão do package.json, e não de github.ref_name, porque é essa que o
          # electron-builder vai procurar — inclusive quando o workflow é disparado à mão pelo
          # botão "Run workflow", onde não existe tag nenhuma.
          tag="v$(node -p "require('./package.json').version")"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"

          quantas=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/releases?per_page=100" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>
                console.log(JSON.parse(d).filter(r => r.tag_name === process.argv[1]).length))" "$tag")

          if [ "$quantas" -eq 0 ]; then
            codigo=$(curl -sS -o resposta.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$api/releases" \
              -d "{\"tag_name\":\"$tag\",\"name\":\"${tag#v}\"}")
            if [ "$codigo" != "201" ]; then
              echo "ERRO: não consegui criar a Release $tag (HTTP $codigo)."
              cat resposta.json
              exit 1
            fi
            echo "Release $tag criada; os instaladores serão anexados a ela."
          else
            echo "Release $tag já existe ($quantas registro(s)) — nada a criar."
          fi

      - name: Gerar instalador e publicar na Release
        run: npx electron-builder ${{ matrix.alvo }} --publish always
        env:
          # Token que o próprio GitHub Actions fornece; é o que o electron-builder usa para
          # criar a Release e anexar os instaladores. Não precisa cadastrar nada.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Conferir se a Release está mesmo servindo os arquivos
        # O passo anterior dizer "sucesso" significa apenas que o envio foi aceito, não que o
        # arquivo ficou acessível na página da tag. Foi exatamente essa a falha da v1.2.3: build
        # verde, envio bem-sucedido, e mesmo assim todo link de download respondendo 404.
        #
        # O manifesto .yml é o arquivo que a atualização automática lê — sem ele, ninguém recebe
        # a versão nova. O instalador é o que a pessoa baixa na mão. Os dois precisam estar lá.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$RUNNER_OS" = "Windows" ]; then
            manifesto="latest.yml"; extensao=".exe"
          else
            manifesto="latest-linux.yml"; extensao=".AppImage"
          fi

          # Três tentativas: o GitHub leva alguns segundos para publicar um arquivo recém-enviado,
          # e reprovar por causa disso seria um alarme falso.
          for tentativa in 1 2 3; do
            node scripts/conferir-release.mjs "$tag" "$manifesto" "$extensao" && exit 0
            echo "Nova conferência em 10s..."
            sleep 10
          done
          exit 1

  android:
    name: Android (APK assinado)
    # O desktop cria a Release primeiro. Assim o Android apenas anexa o APK e nao existe corrida
    # entre tres jobs tentando criar a mesma Release. No modo manual `android`, a Release da
    # versao ja existe e o job pode prosseguir mesmo com o desktop intencionalmente ignorado.
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.target == 'android')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        shell: bash
        run: |
          # sdkmanager fecha a entrada assim que termina de aceitar as licencas. Nesse momento o
          # `yes` recebe SIGPIPE, o que e esperado; com `pipefail`, porem, isso viraria erro 1.
          # A instalacao seguinte continua sendo a verificacao real e falhara se faltar licenca.
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Instalar dependencias
        run: npm ci

      - name: Conferir secrets de assinatura
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          faltando=""
          [ -z "$KEYSTORE_BASE64" ] && faltando="$faltando ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && faltando="$faltando ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && faltando="$faltando ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && faltando="$faltando ANDROID_KEY_PASSWORD"
          if [ -n "$faltando" ]; then
            echo "ERRO: secrets Android ausentes:$faltando"
            echo "Cadastre-os em Settings > Secrets and variables > Actions antes de publicar a tag."
            exit 1
          fi

      - name: Restaurar chave de assinatura
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/osone-android.jks"

      - name: Gerar projeto Android
        shell: bash
        run: |
          config="$RUNNER_TEMP/bubblewrap-config.json"
          jq -n --arg jdk "$JAVA_HOME" --arg sdk "$ANDROID_SDK_ROOT" \
            '{jdkPath: $jdk, androidSdkPath: $sdk}' > "$config"
          npm run android:prepare -- --config="$config"

      - name: Compilar e assinar APK
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          npm run android:build -- \
            --config="$RUNNER_TEMP/bubblewrap-config.json" \
            --signingKeyPath="$RUNNER_TEMP/osone-android.jks" \
            --signingKeyAlias="$KEY_ALIAS"
          versao=$(node -p "require('./package.json').version")
          mv android/app-release-signed.apk "OSONE-G5-${versao}.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "OSONE-G5-${versao}.apk"

      - name: Anexar APK a Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          versao=$(node -p "require('./package.json').version")
          gh release upload "v${versao}" "OSONE-G5-${versao}.apk" --clobber
